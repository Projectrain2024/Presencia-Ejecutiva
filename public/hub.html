<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub Facilitador — LHH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap">
<style>
:root{--pu:#3A1259;--pu-mid:#7B3FA8;--pu-soft:#B68DD4;--pu-border:#D4C0E8;--gold:#E9A020;--bg:#F6F1FC;--card:#fff;--sidebar:#261040;--sidebar-hi:#3A1259;--tx:#1C0D36;--tx2:#6B547E;--tx-bar:#C4B0DC;--ok-bg:#E8F6EE;--ok:#1A7A45;--wa-bg:#FFF3DC;--wa:#9A6200;--pe-bg:#EEE7F8;--pe:#5C3A8A;--tra-bg:#EDE0F8;--tra:#6B2D9A;--trb-bg:#FFF3DC;--trb:#9A6200;--sw:220px}
@media(prefers-color-scheme:dark){:root{--bg:#110820;--card:#1C0B34;--sidebar:#0B0418;--sidebar-hi:#1C0B34;--tx:#EDE0F8;--tx2:#9A7FBE;--pu-border:#4A2878;--ok-bg:#0A2018;--ok:#50E89A;--wa-bg:#1E1000;--wa:#E8A840;--pe-bg:#1A0A2E;--pe:#C89EF0;--tra-bg:#2A1050;--tra:#C89EF0;--trb-bg:#2E1E00;--trb:#E8B84A}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh;display:flex}
/* Sidebar */
.sidebar{width:var(--sw);min-height:100vh;background:var(--sidebar);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:20}
.sb-brand{padding:26px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-lhh{font-family:'Playfair Display',serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.sb-name{font-size:15px;font-weight:600;color:#fff}
.sb-sub{font-size:11px;color:var(--tx-bar);margin-top:1px}
.sb-sec{padding:14px 12px 4px}
.sb-lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-bar);opacity:.5;padding:0 8px;margin-bottom:3px}
.nav{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--tx-bar);font-size:13px;margin-bottom:1px;transition:background .12s,color .12s}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:var(--sidebar-hi);color:#fff;font-weight:500;border-left:3px solid var(--gold);padding-left:7px}
.nav svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav.on svg{opacity:1}
.sb-foot{margin-top:auto;padding:16px 20px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between}
.sb-user{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pu-mid),var(--gold));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.sb-foot .un{font-size:13px;color:#fff;font-weight:500}
.sb-foot .ur{font-size:11px;color:var(--tx-bar)}
.logout{font-size:11px;color:var(--tx-bar);text-decoration:none;opacity:.6}
.logout:hover{opacity:1;color:#fff}
/* Main */
.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--card);border-bottom:1px solid var(--pu-border);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.tb-title{font-size:15px;font-weight:600}
.tb-acts{display:flex;gap:8px}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:opacity .12s}
.btn:hover{opacity:.85}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--gold);color:#1C0D36}
.btn-ghost{background:transparent;color:var(--tx2);border:1px solid var(--pu-border)}
.btn-danger{background:#FDECEA;color:#C0392B;border:1px solid #F5C6C2}
/* Content */
.content{padding:24px 28px 56px}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--pu-border);border-radius:11px;padding:17px 19px}
.stat-lbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);margin-bottom:4px}
.stat-val{font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat-sub{font-size:11.5px;color:var(--tx2);margin-top:3px}
/* Section header */
.sec-hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px}
.sec-ttl{font-size:14px;font-weight:600}
/* Cards */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--pu-border);border-radius:11px;padding:18px 20px;cursor:pointer;transition:border-color .14s,box-shadow .14s}
.card:hover{border-color:var(--pu-mid)}
.card.sel{border-color:var(--pu-mid);box-shadow:0 0 0 3px rgba(123,63,168,.12)}
.card-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:9px}
.card-client{font-family:'Playfair Display',serif;font-size:16px;line-height:1.2}
.card-code{font-size:11px;color:var(--tx2);margin-top:2px}
.pill{font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.pill.act{background:var(--ok-bg);color:var(--ok)}
.pill.pend{background:var(--pe-bg);color:var(--pe)}
.pill.closed{background:var(--wa-bg);color:var(--wa)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:5px}
.tag.ra{background:var(--tra-bg);color:var(--tra)}
.tag.rb{background:var(--trb-bg);color:var(--trb)}
.pbar-hdr{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx2);margin-bottom:5px}
.pbar-hdr strong{color:var(--tx);font-weight:600}
.pbar{height:5px;background:var(--bg);border-radius:99px;overflow:hidden}
.pbar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pu-mid),var(--pu-soft));transition:width .4s}
.pbar-fill.full{background:linear-gradient(90deg,#2A9D5C,#48C87A)}
.card-meta{font-size:11.5px;color:var(--tx2);margin-top:9px;display:flex;gap:12px;flex-wrap:wrap}
.empty{background:var(--card);border:1px dashed var(--pu-border);border-radius:11px;padding:40px 20px;text-align:center;grid-column:1/-1}
.empty-icon{font-size:30px;margin-bottom:10px}
.empty-ttl{font-size:15px;font-weight:600;margin-bottom:5px}
.empty-sub{font-size:13px;color:var(--tx2);margin-bottom:16px}
/* Detail */
.detail{background:var(--card);border:1px solid var(--pu-border);border-radius:11px;overflow:hidden}
.det-hdr{background:linear-gradient(135deg,var(--pu),#5A2090);padding:20px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.det-ttl{font-family:'Playfair Display',serif;font-size:19px;color:#fff;margin-bottom:3px}
.det-sub{font-size:12px;color:rgba(255,255,255,.6)}
.det-acts{display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap}
.btn-w{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);font-family:inherit;font-size:12px;font-weight:500;padding:6px 12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-w:hover{background:rgba(255,255,255,.22)}
.btn-gld{background:var(--gold);color:#1C0D36;border:none;font-family:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.det-body{padding:20px 24px}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.det-col-ttl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);margin-bottom:10px}
.ilist{display:flex;flex-direction:column;gap:7px}
.irow{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-radius:8px;border:1px solid var(--pu-border)}
.irow-info{display:flex;align-items:center;gap:9px}
.idot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.idot.ra{background:var(--tra)}.idot.rb{background:var(--trb)}
.irow-name{font-size:13px;font-weight:500}
.irow-type{font-size:11px;color:var(--tx2)}
.irow-stat .n{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.irow-stat .of{font-size:10.5px;color:var(--tx2);text-align:right}
.btn-irow{background:none;border:1.5px solid var(--pu-border);color:var(--pu-mid);font-family:inherit;font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-irow:hover{background:rgba(123,63,168,.08);border-color:var(--pu-mid)}
.add-link{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--pu-mid);font-weight:500;margin-top:10px;cursor:pointer}
.add-link:hover{opacity:.75}
.ptbl{width:100%;border-collapse:collapse;margin-top:2px}
.ptbl th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);padding:0 0 7px;border-bottom:1px solid var(--pu-border)}
.ptbl td{padding:9px 0;font-size:12.5px;border-bottom:1px solid var(--pu-border);vertical-align:middle}
.ptbl tr:last-child td{border-bottom:none}
.pav{width:24px;height:24px;border-radius:50%;background:var(--tra-bg);color:var(--tra);font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-right:6px;flex-shrink:0;vertical-align:middle}
/* Chart */
.chart-rows{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.c-row{display:grid;grid-template-columns:90px 1fr 32px;align-items:center;gap:8px}
.c-lbl{font-size:11.5px;color:var(--tx2);text-align:right}
.c-track{height:7px;background:var(--bg);border-radius:99px;overflow:hidden}
.c-bar{height:100%;border-radius:99px;transition:width .5s}
.c-val{font-size:11.5px;font-variant-numeric:tabular-nums;text-align:right}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto}
.modal-hdr{padding:20px 22px 0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1}
.modal-ttl{font-family:'Playfair Display',serif;font-size:18px}
.modal-x{background:none;border:none;cursor:pointer;color:var(--tx2);font-size:22px;line-height:1;padding:4px}
.modal-body{padding:18px 22px 24px}
.f-row{margin-bottom:13px}
.f-row-2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px}
.f-lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);display:block;margin-bottom:5px}
.f-inp{width:100%;padding:9px 12px;border:1px solid var(--pu-border);border-radius:8px;font-family:inherit;font-size:13.5px;color:var(--tx);background:var(--bg);outline:none;transition:border-color .14s}
.f-inp:focus{border-color:var(--pu-mid)}
.instr-opts{display:flex;flex-direction:column;gap:6px}
.instr-opt{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--pu-border);border-radius:8px;cursor:pointer;transition:border-color .12s,background .12s}
.instr-opt:hover{border-color:var(--pu-mid)}
.instr-opt.on{border-color:var(--pu-mid);background:var(--pe-bg)}
.instr-opt input{accent-color:var(--pu-mid);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.instr-opt-lbl{font-size:13px;font-weight:500}
.instr-opt-sub{font-size:11px;color:var(--tx2)}
.instr-opt-wrap{display:flex;flex-direction:column}
.leader-chip{display:inline-flex;align-items:center;gap:4px;background:var(--pe-bg);color:var(--pe);font-size:12px;font-weight:500;padding:3px 8px;border-radius:20px;border:1px solid var(--pu-border)}
.leader-chip button{background:none;border:none;cursor:pointer;color:var(--tx2);font-size:14px;line-height:1;padding:0 0 0 2px;display:flex;align-items:center}
.leader-chip button:hover{color:var(--tx)}
.leaders-section{padding:8px 12px 10px;border-top:1px solid var(--pu-border);background:var(--bg)}
.leaders-chips{display:flex;flex-wrap:wrap;gap:5px;min-height:24px;margin-bottom:6px}
.instr-dates{padding:0 2px}
.instr-dates.hidden{display:none}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--pu-border)}
/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1C0D36;color:#fff;padding:9px 18px;border-radius:9px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:opacity .22s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* Loading */
.loading{color:var(--tx2);font-size:13px;text-align:center;padding:40px}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sb-brand">
    <div class="sb-lhh">LHH · Colombia</div>
    <div class="sb-name">Hub del Facilitador</div>
    <div class="sb-sub">Presencia Ejecutiva</div>
  </div>
  <div class="sb-sec">
    <div class="sb-lbl">Principal</div>
    <div class="nav on" id="nav-progs" onclick="showPrograms()">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 4a1 1 0 011-1h4a1 1 0 011 1v5a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm0 9a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1H4a1 1 0 01-1-1v-3zm8-9a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1h-4a1 1 0 01-1-1V4zm0 8a1 1 0 011-1h4a1 1 0 011 1v5a1 1 0 01-1 1h-4a1 1 0 01-1-1v-5z"/></svg>
      Programas
    </div>
  </div>
  <div class="sb-sec">
    <div class="sb-lbl">Instrumentos</div>
    <div class="nav" id="nav-fr" onclick="showInstr('fr-equipo')">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"/></svg>
      French &amp; Raven
    </div>
    <div class="nav" id="nav-rbs" onclick="showInstr('rbs')">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
      Reflected Best Self
    </div>
  </div>
  <div class="sb-foot">
    <div class="sb-user">
      <div class="av">AC</div>
      <div><div class="un">Ana Catalina</div><div class="ur">Facilitadora LHH</div></div>
    </div>
    <a class="logout" href="/logout">Salir</a>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="tb-title">Programas</div>
    <div class="tb-acts">
      <button class="btn btn-primary" onclick="openModal('new-prog')">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
        Nuevo programa
      </button>
    </div>
  </div>
  <div class="content" id="content">
    <div class="loading">Cargando programas…</div>
  </div>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
/* ── Constants ── */
const INSTRUMENTS = {
  'fr-equipo': { label:'French & Raven · Equipo', tag:'ra', desc:'Los miembros del equipo evalúan al líder — anónimo' },
  'rbs':       { label:'Reflected Best Self',      tag:'rb', desc:'Reflexión de fortalezas con ayuda de la red' }
};

const POWER_META = {
  coercitivo:    { label:'Coercitivo',    color:'#c0392b' },
  recompensa:    { label:'Recompensa',    color:'#e67e22' },
  legitimo:      { label:'Legítimo',      color:'#2980b9' },
  experto:       { label:'Experto',       color:'#27ae60' },
  referente:     { label:'Referente',     color:'#8e44ad' },
  informacional: { label:'Informacional', color:'#16a085' },
};
const POWER_KEYS = Object.keys(POWER_META);

/* Normaliza instruments: acepta string[] (legado) u objeto[] con {key,start_date,end_date} */
function instrList(raw) {
  return (raw||[]).map(i => {
    const key = typeof i === 'string' ? i : i.key;
    const meta = INSTRUMENTS[key];
    if (!meta) return null;
    return { key, ...meta, start_date: i.start_date||null, end_date: i.end_date||null };
  }).filter(Boolean);
}

function fmtDateShort(d) { return d ? new Date(d+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}) : ''; }
const BASE_CLR = { Experto:'#7B3FA8', Referente:'#E9A020', Legítimo:'#2A9D5C', Recompensa:'#1A6A8A', Coercitivo:'#C0392B', Informacional:'#8E44AD' };
const BASE_SIT = { Experto:['s1','s2','s3'], Referente:['s4','s5','s6'], Legítimo:['s7','s8','s9'], Recompensa:['s10','s11'], Coercitivo:['s12','s13'], Informacional:['s14','s15'] };

/* ── State ── */
let programs = [], selId = null, modal = null, detailData = {};

/* ── Helpers ── */
function esc(s){ const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML }
function fmtDate(s){ try{return s?new Date(s+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}):'';}catch{return s||''} }
function initials(n){ return (n||'').trim().split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase()||'?' }
function showToast(m){ const t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400) }
async function api(url,opts={}){ const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j }

/* ── Vista activa ── */
let activeView = 'programs'; // 'programs' | 'fr-equipo' | 'rbs'

const INSTR_META = {
  'fr-equipo': {
    label: 'French & Raven · Equipo',
    key: 'fr-equipo',
    color: '#7B3FA8',
    tagClass: 'ra',
    desc: 'Evaluación 360° donde el equipo evalúa de forma anónima las bases de poder que percibe en su líder. Basado en el modelo de French & Raven (1959) con 6 bases: Coercitivo, Recompensa, Legítimo, Experto, Referente e Informacional.',
    how: ['El equipo accede al link del instrumento','Cada persona evalúa al líder de forma anónima (15 situaciones)','Los resultados se consolidan en el hub para el facilitador'],
  },
  rbs: {
    label: 'Reflected Best Self',
    key: 'rbs',
    color: '#2980b9',
    tagClass: 'rb',
    desc: 'Autoevaluación del líder sobre sus propias bases de poder. El líder responde 15 situaciones desde su perspectiva y obtiene un perfil de su estilo de influencia dominante.',
    how: ['El líder accede al link del instrumento','Responde 15 situaciones desde su propia perspectiva','Obtiene inmediatamente su perfil de poder con impulsores y limitantes'],
  },
};

function setNavActive(id) {
  ['nav-progs','nav-fr','nav-rbs'].forEach(n => {
    const el = document.getElementById(n);
    if (el) el.classList.toggle('on', el.id === id);
  });
}

function showPrograms() {
  activeView = 'programs';
  setNavActive('nav-progs');
  document.querySelector('.tb-title').textContent = 'Programas';
  document.querySelector('.tb-acts').innerHTML = `<button class="btn btn-primary" onclick="openModal('new-prog')"><svg viewBox="0 0 20 20" fill="currentColor" style="width:14px;height:14px"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg> Nuevo programa</button>`;
  render();
}

function showInstr(key) {
  activeView = key;
  setNavActive(key === 'fr-equipo' ? 'nav-fr' : 'nav-rbs');
  const m = INSTR_META[key];
  document.querySelector('.tb-title').textContent = m.label;
  document.querySelector('.tb-acts').innerHTML = '';

  const using = programs.filter(p => instrList(p.instruments).some(i => i.key === key));
  const origin = location.origin;

  document.getElementById('content').innerHTML = `
    <div style="max-width:700px">
      <div style="background:var(--card);border:1px solid var(--pu-border);border-radius:12px;padding:22px 24px;margin-bottom:18px">

/* ── Load programs ── */
async function loadPrograms() {
  programs = await api('/api/programs');
  render();
}

/* ── Render ── */
function render() {
  const totalPart = programs.reduce((s,p) => s + (p._parts||0), 0);
  const totalResp = programs.reduce((s,p) => s + (p._resps||0), 0);
  const next = programs.find(p => p.session_date && p.status === 'active');

  const statsHtml = `<div class="stats">
    <div class="stat"><div class="stat-lbl">Programas activos</div><div class="stat-val">${programs.filter(p=>p.status==='active').length}</div><div class="stat-sub">${programs.filter(p=>p.status==='pending').length} por configurar</div></div>
    <div class="stat"><div class="stat-lbl">Participantes</div><div class="stat-val">${detailData[selId]?.participants?.length||'—'}</div><div class="stat-sub">en programa seleccionado</div></div>
    <div class="stat"><div class="stat-lbl">Evaluaciones</div><div class="stat-val">${detailData[selId]?.responses?.length||'—'}</div><div class="stat-sub">recibidas</div></div>
    <div class="stat"><div class="stat-lbl">Próxima sesión</div><div class="stat-val" style="font-size:17px;margin-top:3px">${next?fmtDate(next.session_date):'—'}</div><div class="stat-sub">${next?esc(next.name):'Sin sesiones'}</div></div>
  </div>`;

  const cardsHtml = programs.length === 0
    ? `<div class="empty"><div class="empty-icon">📋</div><div class="empty-ttl">Aún no hay programas</div><div class="empty-sub">Crea el primero para empezar a gestionar evaluaciones.</div><button class="btn btn-primary" onclick="openModal('new-prog')"><svg viewBox="0 0 20 20" fill="currentColor" style="width:14px;height:14px"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg> Nuevo programa</button></div>`
    : programs.map(p => renderCard(p)).join('');

  const detHtml = selId && detailData[selId] ? renderDetail(selId) : '';

  document.getElementById('content').innerHTML = statsHtml
    + `<div class="sec-hdr"><div class="sec-ttl">Programas</div></div>`
    + `<div class="cards">${cardsHtml}</div>`
    + (selId && detailData[selId]
        ? `<div class="sec-hdr"><div class="sec-ttl">Detalle — ${esc(programs.find(p=>p.id===selId)?.name||'')}</div></div>${detHtml}`
        : '');

  renderModal();
}

function renderCard(p) {
  const d = detailData[p.id];
  const parts = d?.participants?.length || 0;
  const resps = d?.responses?.length || 0;
  const pct   = parts > 0 ? Math.round(resps/parts*100) : 0;
  const instrs = instrList(p.instruments);
  return `<div class="card${selId===p.id?' sel':''}" onclick="selectProg('${esc(p.id)}')">
    <div class="card-hdr">
      <div><div class="card-client">${esc(p.name)}</div><div class="card-code">${esc(p.code||'')}${p.context?' · '+esc(p.context):''}</div></div>
      <span class="pill ${p.status==='active'?'act':p.status==='closed'?'closed':'pend'}">${p.status==='active'?'Activo':p.status==='closed'?'Cerrado':'Por configurar'}</span>
    </div>
    <div class="tags">${instrs.map(i=>`<span class="tag ${i.tag}">${esc(i.label)}</span>`).join('')}</div>
    <div class="pbar-hdr"><span>Evaluaciones</span><span><strong>${resps}</strong> / ${parts} participante${parts!==1?'s':''}</span></div>
    <div class="pbar"><div class="pbar-fill${pct===100?' full':''}" style="width:${pct}%"></div></div>
    <div class="card-meta">${p.session_date?`<span>📅 ${fmtDate(p.session_date)}</span>`:''}${p.deadline?`<span>⏰ Cierre: ${fmtDate(p.deadline)}</span>`:''}</div>

}

function buildChart(frResps) {
  const bases=['Experto','Referente','Legítimo','Recompensa','Coercitivo','Informacional'];
  const avgs={};
  bases.forEach(b=>{
    const ids=BASE_SIT[b];
    const total=frResps.reduce((s,r)=>s+ids.reduce((a,id)=>a+(Number(r.answers?.[id])||0),0)/ids.length,0);
    avgs[b]=frResps.length>0?total/frResps.length:0;
  });
  return `<div class="chart-rows">${bases.map(b=>`
    <div class="c-row">
      <div class="c-lbl">${b}</div>
      <div class="c-track"><div class="c-bar" style="width:${Math.round(avgs[b]/5*100)}%;background:${BASE_CLR[b]}"></div></div>
      <div class="c-val">${avgs[b].toFixed(1)}</div>
    </div>`).join('')}</div>
  <div style="font-size:11px;color:var(--tx2);margin-top:8px">${frResps.length} evaluación${frResps.length!==1?'es':''} · escala 1–5</div>`;
}

/* ── Panorama de liderazgo ── */
function calcPowerProfile(responses) {
  // responses: array de {answers: {q0:'legitimo', q1:'experto',...}}
  const counts = {};
  POWER_KEYS.forEach(k => counts[k] = 0);
  responses.forEach(r => {
    Object.values(r.answers || {}).forEach(p => {
      if (counts[p] !== undefined) counts[p]++;
    });
  });
  const total = Object.values(counts).reduce((s,n) => s+n, 0);
  return { counts, total, dominant: Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0] };
}

function miniBar(counts, total, highlight) {
  return POWER_KEYS.map(k => {
    const n = counts[k] || 0;
    const pct = total > 0 ? Math.round(n/total*100) : 0;
    const isTop = k === highlight;
    return `<div style="display:grid;grid-template-columns:80px 1fr 28px;align-items:center;gap:7px;${isTop?'font-weight:600':''}">
      <div style="font-size:11px;color:var(--tx);text-align:right">${POWER_META[k].label}</div>
      <div style="height:8px;background:var(--pu-border);border-radius:4px;overflow:hidden">
        <div style="height:100%;border-radius:4px;background:${POWER_META[k].color};width:${pct}%;transition:width .4s"></div>
      </div>
      <div style="font-size:11px;font-weight:600;color:${isTop?POWER_META[k].color:'var(--tx2)'}">
        ${n}
      </div>
    </div>`;
  }).join('');
}

function powerDominantChip(dominant) {
  const pm = POWER_META[dominant] || { label:'—', color:'var(--tx2)' };
  return `<div style="padding:3px 10px;background:${pm.color}18;border:1px solid ${pm.color}55;border-radius:20px;font-size:11px;font-weight:700;color:${pm.color};white-space:nowrap">${pm.label}</div>`;
}

function leaderCard(name, counts, total, dominant, label, evalCount) {
  return `<div style="flex:1;min-width:0">
    <div style="font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);margin-bottom:8px">${label}</div>
    <div style="display:flex;flex-direction:column;gap:4px">
      ${miniBar(counts, total, dominant)}
    </div>
    <div style="font-size:10.5px;color:var(--tx2);margin-top:8px">${evalCount}</div>
  </div>`;
}

function showPanorama(pid) {
  const prog = programs.find(p => p.id === pid);
  const d = detailData[pid];
  if (!prog || !d) return;

  const rlist = d.responses || [];
  setNavActive('nav-progs');
  document.querySelector('.tb-title').textContent = `Panorama — ${prog.name}`;
  document.querySelector('.tb-acts').innerHTML =
    `<button class="btn btn-ghost" onclick="showPrograms();selectProg('${esc(pid)}')">← Volver al programa</button>`;

  // ── FR-EQUIPO: agrupar por líder (clave: leader_name normalizado) ──
  const frResps = rlist.filter(r => r.instrument === 'fr-equipo' && r.answers && Object.keys(r.answers).length > 0);
  const byLeader = {};
  frResps.forEach(r => {
    const key = (r.leader_name || r.participant_name || 'Sin nombre').trim().toLowerCase();
    const display = (r.leader_name || r.participant_name || 'Sin nombre').trim();
    if (!byLeader[key]) byLeader[key] = { display, resps: [] };
    byLeader[key].resps.push(r);
  });

  // ── RBS: agrupar por participante (clave normalizada) ──
  const rbsResps = rlist.filter(r => r.instrument === 'rbs' && r.answers && Object.keys(r.answers).length > 0);
  const byRbs = {};
  rbsResps.forEach(r => {
    const key = (r.participant_name || 'Sin nombre').trim().toLowerCase();
    const display = (r.participant_name || 'Sin nombre').trim();
    if (!byRbs[key]) byRbs[key] = { display, resps: [] };
    byRbs[key].resps.push(r);
  });

  // ── Unión de nombres para comparación ──
  const allNames = new Set([...Object.keys(byLeader), ...Object.keys(byRbs)]);

  // ── Panorama empresa (FR-EQUIPO dominantes) ──
  const compDom = {};
  POWER_KEYS.forEach(k => compDom[k] = 0);
  Object.values(byLeader).forEach(({ resps }) => {
    const { dominant } = calcPowerProfile(resps);
    if (dominant) compDom[dominant]++;
  });
  const totalFR = Object.keys(byLeader).length;
  const topFR = Object.entries(compDom).sort((a,b)=>b[1]-a[1])[0];

  // ── Panorama empresa (RBS dominantes) ──
  const compDomRbs = {};
  POWER_KEYS.forEach(k => compDomRbs[k] = 0);
  Object.values(byRbs).forEach(({ resps }) => {
    const { dominant } = calcPowerProfile(resps);
    if (dominant) compDomRbs[dominant]++;
  });
  const totalRbs = Object.keys(byRbs).length;
  const topRbs = Object.entries(compDomRbs).sort((a,b)=>b[1]-a[1])[0];

  const hasAny = totalFR > 0 || totalRbs > 0;
  let html = `<div style="max-width:960px">`;

  // ─── Resumen de empresa ───
  if (hasAny) {
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px">`;

    // Columna RBS empresa
    html += `<div style="background:var(--card);border:1px solid var(--pu-border);border-radius:12px;padding:20px 22px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <div style="width:10px;height:10px;border-radius:50%;background:#2980b9;flex-shrink:0"></div>
        <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2)">Cómo se perciben a sí mismos · RBS</div>
      </div>
      ${totalRbs === 0
        ? `<div style="font-size:13px;color:var(--tx2)">Sin autoevaluaciones registradas.</div>`
        : `<div style="font-family:'Playfair Display',serif;font-size:22px;color:${POWER_META[topRbs[0]]?.color};margin-bottom:4px">${POWER_META[topRbs[0]]?.label}</div>
           <div style="font-size:12px;color:var(--tx2);margin-bottom:14px">base dominante en ${topRbs[1]} de ${totalRbs} autoevaluación${totalRbs!==1?'es':''}</div>
           <div style="display:flex;flex-direction:column;gap:5px">
             ${POWER_KEYS.map(k => {
               const n = compDomRbs[k]; const pct = totalRbs>0?Math.round(n/totalRbs*100):0;
               return `<div style="display:grid;grid-template-columns:80px 1fr 20px;align-items:center;gap:6px">
                 <div style="font-size:11px;color:var(--tx);text-align:right">${POWER_META[k].label}</div>
                 <div style="height:7px;background:var(--pu-border);border-radius:4px;overflow:hidden">
                   <div style="height:100%;border-radius:4px;background:${POWER_META[k].color};width:${pct}%"></div>
                 </div>
                 <div style="font-size:10px;font-weight:700;color:${n>0?POWER_META[k].color:'var(--tx2)'}">${n||''}</div>
               </div>`;
             }).join('')}
           </div>`
      }
    </div>`;

    // Columna FR empresa
    html += `<div style="background:var(--card);border:1px solid var(--pu-border);border-radius:12px;padding:20px 22px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">

      ${totalFR === 0
        ? `<div style="font-size:13px;color:var(--tx2)">Sin evaluaciones de equipo registradas.</div>`

           <div style="font-size:12px;color:var(--tx2);margin-bottom:14px">base dominante en ${topFR[1]} de ${totalFR} líder${totalFR!==1?'es':''} evaluado${totalFR!==1?'s':''}</div>
           <div style="display:flex;flex-direction:column;gap:5px">
             ${POWER_KEYS.map(k => {
               const n = compDom[k]; const pct = totalFR>0?Math.round(n/totalFR*100):0;
               return `<div style="display:grid;grid-template-columns:80px 1fr 20px;align-items:center;gap:6px">
                 <div style="font-size:11px;color:var(--tx);text-align:right">${POWER_META[k].label}</div>
                 <div style="height:7px;background:var(--pu-border);border-radius:4px;overflow:hidden">
                   <div style="height:100%;border-radius:4px;background:${POWER_META[k].color};width:${pct}%"></div>
                 </div>
                 <div style="font-size:10px;font-weight:700;color:${n>0?POWER_META[k].color:'var(--tx2)'}">${n||''}</div>
               </div>`;
             }).join('')}
           </div>`
      }
    </div>`;
    html += `</div>`; // end grid empresa
  }

  // ─── Tarjetas individuales ───
  if (allNames.size > 0) {
    html += `<div style="font-size:14px;font-weight:600;margin-bottom:14px">Perfiles individuales
      <span style="font-size:12px;font-weight:400;color:var(--tx2);margin-left:8px">
        <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#2980b9;display:inline-block"></span>Autopercepción · RBS</span>
        &nbsp;&nbsp;
        <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#8e44ad;display:inline-block"></span>Percepción del equipo · F&R</span>
      </span>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px">`;

    [...allNames].sort().forEach(key => {
      const frEntry  = byLeader[key];
      const rbsEntry = byRbs[key];
      const displayName = (frEntry?.display || rbsEntry?.display || key);

      const frProfile  = frEntry  ? calcPowerProfile(frEntry.resps)  : null;
      const rbsProfile = rbsEntry ? calcPowerProfile(rbsEntry.resps) : null;

      const hasBoth = frProfile && rbsProfile;
      const diff = hasBoth && frProfile.dominant !== rbsProfile.dominant;

      html += `<div style="background:var(--card);border:1px solid ${diff?'rgba(233,160,32,.5)':' var(--pu-border)'};border-radius:12px;padding:18px 20px;${diff?'box-shadow:0 0 0 2px rgba(233,160,32,.12)':''}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
          <div style="font-size:15px;font-weight:600">${esc(displayName)}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${rbsProfile ? `<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2)"><span style="width:7px;height:7px;border-radius:50%;background:#2980b9;display:inline-block"></span>RBS: ${powerDominantChip(rbsProfile.dominant)}</div>` : ''}
            ${frProfile  ? `<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2)"><span style="width:7px;height:7px;border-radius:50%;background:#8e44ad;display:inline-block"></span>F&R: ${powerDominantChip(frProfile.dominant)}</div>` : ''}
            ${diff ? `<div style="font-size:11px;font-weight:600;color:#9A6200;background:#FFF3DC;border:1px solid #F5D98A;padding:3px 9px;border-radius:20px">Brecha detectada</div>` : ''}
          </div>
        </div>
        <div style="display:grid;grid-template-columns:${hasBoth?'1fr 1px 1fr':'1fr'};gap:16px;align-items:start">
          ${rbsProfile
            ? leaderCard(displayName, rbsProfile.counts, rbsProfile.total, rbsProfile.dominant,
                '🔵 Cómo se percibe a sí mismo/a · Reflected Best Self',
                `${rbsEntry.resps.length} autoevaluación${rbsEntry.resps.length!==1?'es':''}`)
            : `<div style="font-size:12px;color:var(--tx2);padding:8px 0">Sin autoevaluación RBS registrada.</div>`
          }
          ${hasBoth ? `<div style="background:var(--pu-border);width:1px;align-self:stretch"></div>` : ''}
          ${frProfile
            ? leaderCard(displayName, frProfile.counts, frProfile.total, frProfile.dominant,
                '🟣 Cómo lo percibe su equipo · French & Raven',
                `${frEntry.resps.length} evaluación${frEntry.resps.length!==1?'es':''} del equipo`)
            : `<div style="font-size:12px;color:var(--tx2);padding:8px 0">Sin evaluación de equipo (F&R) registrada.</div>`
          }
        </div>
      </div>`;
    });
    html += `</div>`;
  } else {
    html += `<div style="background:var(--card);border:1px dashed var(--pu-border);border-radius:11px;padding:40px;text-align:center;color:var(--tx2);font-size:13px">
      Aún no hay evaluaciones registradas para este programa.
    </div>`;
  }

  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}

/* ── Actions ── */
async function selectProg(id) {
  if (selId === id) { selId = null; render(); return; }
  selId = id;
  render();
  try {
    detailData[id] = await api('/api/programs/' + id);
    render();
  } catch(e) { showToast('Error: ' + e.message); }
}

async function deleteProg(id) {
  if (!confirm('¿Eliminar este programa y todos sus datos?')) return;
  try {
    await api('/api/programs/' + id, { method:'DELETE' });
    if (selId === id) selId = null;
    delete detailData[id];
    await loadPrograms();
    showToast('Programa eliminado');
  } catch(e) { showToast('Error: ' + e.message); }
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(()=>showToast('✓ Link copiado')).catch(()=>showToast(url));
}

/* ── Invite Modal ── */
let invitePid = null;
let inviteEmails = [''];
let inviteInstr = null;
let inviteSending = false;

function openInviteModal(pid) {
  invitePid = pid;
  inviteEmails = [''];
  inviteSending = false;
  const prog = programs.find(p => p.id === pid);
  const instrs = instrList(prog?.instruments || []);
  inviteInstr = instrs[0]?.key || null;
  renderInviteModal();
}

function renderInviteModal() {
  const root = document.getElementById('modal-root');
  if (!invitePid) { root.innerHTML = ''; return; }
  const prog = programs.find(p => p.id === invitePid);
  const instrs = instrList(prog?.instruments || []);
  const link = inviteInstr ? `${location.origin}/p/${invitePid}/${inviteInstr}` : '';

  root.innerHTML = `<div class="modal-bg" onclick="e => { if(e.target===this) closeInviteModal() }">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-hdr">
        <div class="modal-ttl">Invitar por email</div>
        <button class="modal-x" onclick="closeInviteModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="f-row">
          <label class="f-lbl">Programa</label>
          <div style="font-size:14px;font-weight:500;color:var(--tx)">${esc(prog?.name||'')}</div>
        </div>

        <div class="f-row">
          <label class="f-lbl">Instrumento</label>
          <div class="instr-opts">
            ${instrs.map(i => `
              <label class="instr-opt${inviteInstr===i.key?' on':''}">
                <input type="radio" name="inv-instr" value="${esc(i.key)}"
                  ${inviteInstr===i.key?'checked':''}
                  onchange="inviteInstr='${esc(i.key)}';renderInviteModal()">
                <div class="instr-opt-wrap">
                  <div class="instr-opt-lbl">${esc(i.label)}</div>
                  <div class="instr-opt-sub">${i.key==='fr-equipo'?'El equipo evalúa al líder (anónimo)':'El líder se autoevalúa'}</div>
                </div>
              </label>`).join('')}
          </div>
        </div>

        <div class="f-row">
          <label class="f-lbl">Emails de destinatarios</label>
          <div id="email-list" style="display:flex;flex-direction:column;gap:7px">
            ${inviteEmails.map((e,i) => `
              <div style="display:flex;gap:7px;align-items:center">
                <input class="f-inp" type="email" placeholder="nombre@empresa.com"
                  value="${esc(e)}"
                  oninput="inviteEmails[${i}]=this.value"
                  style="flex:1">
                ${inviteEmails.length>1
                  ? `<button onclick="inviteEmails.splice(${i},1);renderInviteModal()"
                       style="background:none;border:none;cursor:pointer;color:var(--tx2);font-size:18px;line-height:1;padding:2px 4px">×</button>`
                  : ''}
              </div>`).join('')}
          </div>
          <button onclick="inviteEmails.push('');renderInviteModal()"
            style="margin-top:8px;background:none;border:none;cursor:pointer;font-size:12px;color:var(--pu-mid);font-weight:600;padding:0;display:flex;align-items:center;gap:4px">
            <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
            Agregar otro email
          </button>
        </div>

        ${link ? `<div style="background:var(--bg);border:1px solid var(--pu-border);border-radius:8px;padding:10px 13px;margin-top:4px">
          <div style="font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);margin-bottom:4px">Link que recibirán</div>
          <div style="font-size:12px;color:var(--pu-mid);font-family:monospace;word-break:break-all">${link}</div>
        </div>` : ''}

        <div id="invite-msg" style="margin-top:12px;font-size:13px;display:none"></div>

        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeInviteModal()">Cancelar</button>
          <button class="btn btn-ghost" onclick="sendMailto()" style="gap:5px">
            <svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/></svg>
            Abrir en correo
          </button>
          <button class="btn btn-primary" onclick="sendInvites()" ${inviteSending?'disabled':''}>
            ${inviteSending ? 'Enviando…' : 'Enviar invitación'}
          </button>
        </div>
      </div>
    </div>
  </div>`;
}

function closeInviteModal() { invitePid = null; renderInviteModal(); }

function sendMailto() {
  const validEmails = inviteEmails.filter(e => e.trim());
  if (!validEmails.length || !inviteInstr) return;
  const prog = programs.find(p => p.id === invitePid);
  const link = `${location.origin}/p/${invitePid}/${inviteInstr}`;
  const instrLabel = inviteInstr === 'fr-equipo' ? 'French & Raven · Equipo' : 'Reflected Best Self';
  const subject = encodeURIComponent(`Invitación a evaluación: ${prog?.name}`);
  const body = encodeURIComponent(
    `Hola,\n\nTe invitamos a completar la evaluación "${instrLabel}" del programa ${prog?.name}.\n\nAccede aquí: ${link}\n\n${inviteInstr==='fr-equipo'?'Tu respuesta es completamente anónima.\n\n':''}LHH · Presencia Ejecutiva`
  );
  window.open(`mailto:${validEmails.join(',')}?subject=${subject}&body=${body}`);
}

async function sendInvites() {
  const validEmails = inviteEmails.filter(e => e.trim() && e.includes('@'));
  if (!validEmails.length) { showMsg('Ingresa al menos un email válido.','#C0392B'); return; }
  if (!inviteInstr) { showMsg('Selecciona un instrumento.','#C0392B'); return; }
  const prog = programs.find(p => p.id === invitePid);
  const link = `${location.origin}/p/${invitePid}/${inviteInstr}`;
  inviteSending = true; renderInviteModal();
  try {
    const r = await api('/api/invite', {
      method: 'POST',
      body: JSON.stringify({ emails: validEmails, instrument: inviteInstr, program_name: prog?.name, link }),
    });
    if (r.mailto) {
      inviteSending = false; renderInviteModal();
      showMsg('El servidor no tiene SMTP configurado. Usa "Abrir en correo" para enviar desde tu cliente de correo.','#E9A020');
      return;
    }
    inviteSending = false;
    closeInviteModal();
    showToast(`✓ ${r.sent} invitación${r.sent!==1?'es':''} enviada${r.sent!==1?'s':''}`);
  } catch(e) {
    inviteSending = false; renderInviteModal();
    showMsg('Error: ' + e.message, '#C0392B');
  }
}

function showMsg(txt, color) {
  const el = document.getElementById('invite-msg');
  if (!el) return;
  el.textContent = txt;
  el.style.color = color;
  el.style.display = 'block';
}

/* ── Modals ── */
function openModal(type) { modal = type; renderModal(); }
function closeModal()    { modal = null; renderModal(); }

function renderModal() {
  const root = document.getElementById('modal-root');
  if (!root) return;
  if (!modal) { root.innerHTML = ''; return; }
  if (modal === 'new-prog')  root.innerHTML = modalNewProg();
  if (modal === 'edit-prog') root.innerHTML = modalEditProg();
  if (modal === 'add-part')  root.innerHTML = modalAddPart();
}

// Líderes configurados para FR-Equipo en el modal actual
let _frLeaders = [];

function renderLeaderChips() {
  const el = document.getElementById('leaders-chips');
  if (!el) return;
  el.innerHTML = _frLeaders.length
    ? _frLeaders.map((l,i) => `<span class="leader-chip">${esc(l)}<button onclick="removeLeader(${i})">×</button></span>`).join('')
    : '<span style="font-size:11px;color:var(--tx2);align-self:center">Aún no hay líderes agregados</span>';
}

function addLeader() {
  const inp = document.getElementById('leader-inp');
  if (!inp) return;
  const name = inp.value.trim();
  if (!name) return;
  if (!_frLeaders.includes(name)) _frLeaders.push(name);
  inp.value = '';
  renderLeaderChips();
}

function removeLeader(i) {
  _frLeaders.splice(i, 1);
  renderLeaderChips();
}

function instrFormRows(currentInstruments) {
  /* currentInstruments: array of {key,start_date,end_date,leaders} or null for new */
  const cur = {};
  (currentInstruments||[]).forEach(i => {
    const key = typeof i === 'string' ? i : i.key;
    cur[key] = typeof i === 'string' ? {} : i;
  });
  // Inicializar líderes desde datos actuales
  _frLeaders = [...(cur['fr-equipo']?.leaders || [])];

  return Object.entries(INSTRUMENTS).map(([k,v]) => {
    const checked = !!cur[k];
    const sd = cur[k]?.start_date||'';
    const ed = cur[k]?.end_date||'';
    const leadersSection = k === 'fr-equipo' ? `
      <div class="leaders-section${checked?'':' hidden'}" id="il-fr-equipo">
        <label class="f-lbl" style="font-size:10px;margin-bottom:5px;display:block">Líderes a evaluar</label>
        <div class="leaders-chips" id="leaders-chips">
          ${_frLeaders.length
            ? _frLeaders.map((l,i) => `<span class="leader-chip">${esc(l)}<button onclick="removeLeader(${i})">×</button></span>`).join('')
            : '<span style="font-size:11px;color:var(--tx2);align-self:center">Aún no hay líderes agregados</span>'}
        </div>
        <div style="display:flex;gap:6px">
          <input id="leader-inp" class="f-inp" style="flex:1;font-size:12px" placeholder="Nombre del líder..."
            onkeydown="if(event.key==='Enter'){event.preventDefault();addLeader()}">
          <button class="btn btn-ghost" style="font-size:12px;padding:6px 12px;white-space:nowrap" onclick="addLeader()">+ Agregar</button>
        </div>
      </div>` : '';

    return `<div class="instr-opt-wrap" id="iow-${k}">
      <label class="instr-opt${checked?' on':''}" id="io-${k}">
        <input type="checkbox" id="cb-${k}" onchange="toggleOpt('${k}')"${checked?' checked':''}>
        <div><div class="instr-opt-lbl">${esc(v.label)}</div><div class="instr-opt-sub">${esc(v.desc)}</div></div>
      </label>
      <div class="instr-dates${checked?'':' hidden'}" id="id-${k}">
        <div class="f-row-2" style="margin-top:6px;padding-left:4px">
          <div><label class="f-lbl" style="font-size:10px">Inicio</label><input id="sd-${k}" class="f-inp" type="date" value="${sd}"></div>
          <div><label class="f-lbl" style="font-size:10px">Cierre</label><input id="ed-${k}" class="f-inp" type="date" value="${ed}"></div>
        </div>
      </div>
      ${leadersSection}
    </div>`;
  }).join('');
}

const SECTORES = [
  'Agroindustrial | Químico',
  'Construcción e Infraestructura',
  'Consumo Masivo',
  'Editorial | Medios',
  'Educación',
  'Energético (hidrocarburos y minería)',
  'Farmacéutico | Salud | Dispositivos Médicos',
  'Financiero | Asegurador',
  'Industrial',
  'Logística | Transporte Aéreo y Terrestre',
  'Servicios',
  'TICS (Tecnología de la Información y las Telecomunicaciones)',
  'Público | Gobierno',
  'Automotriz',
  'Retail',
];

function sectorSelect(val='') {
  return `<select id="fsec" class="f-inp">
    <option value="">— Selecciona un sector —</option>
    ${SECTORES.map(s => `<option value="${esc(s)}"${val===s?' selected':''}>${esc(s)}</option>`).join('')}
  </select>`;
}

function modalNewProg() {
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-hdr"><div class="modal-ttl">Nuevo programa</div><button class="modal-x" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <div class="f-row"><label class="f-lbl">Nombre del cliente *</label><input id="fn" class="f-inp" placeholder="Ej: Talma"></div>
        <div class="f-row"><label class="f-lbl">Sector</label>${sectorSelect()}</div>
        <div class="f-row"><label class="f-lbl">Área / contexto</label><input id="fx" class="f-inp" placeholder="Ej: Operaciones Aeroportuarias"></div>
        <div class="f-row"><label class="f-lbl">Instrumentos *</label><div class="instr-opts">${instrFormRows(null)}</div></div>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="saveProg()">Crear programa</button>
        </div>
      </div>
    </div>
  </div>`;
}

function modalEditProg() {
  if (!selId) return '';
  const prog = programs.find(p => p.id === selId);
  if (!prog) return '';
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-hdr"><div class="modal-ttl">Editar programa</div><button class="modal-x" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <div class="f-row"><label class="f-lbl">Nombre del cliente *</label><input id="fn" class="f-inp" value="${esc(prog.name)}" placeholder="Ej: Talma"></div>
        <div class="f-row"><label class="f-lbl">Sector</label>${sectorSelect(prog.sector||'')}</div>
        <div class="f-row"><label class="f-lbl">Área / contexto</label><input id="fx" class="f-inp" value="${esc(prog.context||'')}" placeholder="Ej: Operaciones Aeroportuarias"></div>
        <div class="f-row"><label class="f-lbl">Instrumentos</label><div class="instr-opts">${instrFormRows(prog.instruments)}</div></div>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="updateProg('${esc(selId)}')">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>`;
}


function toggleOpt(k) {
  const checked = document.getElementById('cb-' + k)?.checked;
  document.getElementById('io-' + k)?.classList.toggle('on', checked);
  const dates = document.getElementById('id-' + k);
  if (dates) dates.classList.toggle('hidden', !checked);
  if (k === 'fr-equipo') {
    const ls = document.getElementById('il-fr-equipo');
    if (ls) ls.classList.toggle('hidden', !checked);
  }
}

function collectInstruments() {
  return Object.keys(INSTRUMENTS)
    .filter(k => document.getElementById('cb-' + k)?.checked)
    .map(k => ({
      key: k,
      start_date: document.getElementById('sd-' + k)?.value||null,
      end_date:   document.getElementById('ed-' + k)?.value||null,
      ...(k === 'fr-equipo' ? { leaders: [..._frLeaders] } : {}),
    }));
}

async function saveProg() {
  const name = document.getElementById('fn')?.value?.trim();
  if (!name) { alert('El nombre del cliente es obligatorio.'); return; }
  const instruments = collectInstruments();
  if (!instruments.length) { alert('Selecciona al menos un instrumento.'); return; }
  try {
    const prog = await api('/api/programs', { method:'POST', body: JSON.stringify({
      name,
      sector: document.getElementById('fsec')?.value||'',
      context: document.getElementById('fx')?.value?.trim()||'',
      status: 'active',
      instruments
    })});
    closeModal();
    selId = prog.id;
    await loadPrograms();
    detailData[prog.id] = await api('/api/programs/' + prog.id);
    render();
    showToast('✓ Programa creado');
  } catch(e) { alert('Error: ' + e.message); }
}

async function updateProg(id) {
  const name = document.getElementById('fn')?.value?.trim();
  if (!name) { alert('El nombre del cliente es obligatorio.'); return; }
  const instruments = collectInstruments();
  if (!instruments.length) { alert('Selecciona al menos un instrumento.'); return; }
  try {
    await api('/api/programs/' + id, { method:'PUT', body: JSON.stringify({
      name,
      sector: document.getElementById('fsec')?.value||'',
      context: document.getElementById('fx')?.value?.trim()||'',
      instruments
    })});
    closeModal();
    await loadPrograms();
    detailData[id] = await api('/api/programs/' + id);
    render();
    showToast('✓ Programa actualizado');
  } catch(e) { alert('Error: ' + e.message); }
}

function modalAddPart() {
  if (!selId) return '';
  const prog = programs.find(p => p.id === selId);
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-hdr"><div class="modal-ttl">Agregar participante</div><button class="modal-x" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <div style="font-size:12.5px;color:var(--tx2);margin-bottom:14px">Programa: <strong style="color:var(--tx)">${esc(prog?.name||'')}</strong></div>
        <div class="f-row"><label class="f-lbl">Nombre completo *</label><input id="fpn" class="f-inp" placeholder="Ej: Marcela Ríos" autofocus></div>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="savePart()">Agregar</button>
        </div>
      </div>
    </div>
  </div>`;
}

async function savePart() {
  const name = document.getElementById('fpn')?.value?.trim();
  if (!name || !selId) { alert('Ingresa un nombre.'); return; }
  try {
    await api('/api/programs/' + selId + '/participants', { method:'POST', body: JSON.stringify({ name }) });
    detailData[selId] = await api('/api/programs/' + selId);
    closeModal();
    render();
    showToast('✓ Participante agregado');
  } catch(e) { alert('Error: ' + e.message); }
}

/* ── Init ── */
loadPrograms();
